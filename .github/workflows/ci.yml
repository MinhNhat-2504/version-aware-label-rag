name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check source-only repository state
        env:
          PYTHONPATH: src
        run: python -m labelqa.repository_preflight --scope source
      - name: Run synthetic end-to-end smoke demo
        env:
          PYTHONPATH: src
        run: python -m labelqa.synthetic_demo --output synthetic-demo-report.json
