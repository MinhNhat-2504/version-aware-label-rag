[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-evidence-research"
version = "0.1.0"
description = "Reproducible evidence retrieval experiments for FDARxBench"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
label-evidence = "labelqa.cli:main"
label-evidence-demo = "labelqa.synthetic_demo:main"

[tool.setuptools.packages.find]
where = ["src"]
